<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="index.js"></script>
     
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barriecito&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
    <style>
        
        body{
            background: #9000c4;
            background: linear-gradient(317deg,rgba(144, 0, 196, 0.95) 0%, rgba(0, 212, 255, 0.95) 100%);
        }
        h1{
            color: rgb(255, 252, 69);
            position: relative;
            top: 5px;
            margin-left: 10px;
            font-size: 50px;
            font-family:'Barriecito', cursive;
            margin-bottom: 20px;
            transition: all 0.2s ease-in-out;
        }
        h1:hover{
            color: rgb(217, 20, 20);
            top: 0px;
            transition: all 0.2s ease-in-out;
            font-size: 60px;
        }
        table, th, td {
            border: 5px solid black;
            border-collapse: separate;
            border-spacing: 15px 5px;
            border-radius: 20px;
            margin-top: 40px;
            padding: 10px;
        }
        th,td{
            text-align: center;
            background-color: pink;
        }
        table{
            font-size: 20px;
            background-color: skyblue;
            box-shadow: 5px 10px 18px #000000;
        }
        .main{
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        button{
            height: 50px;
            width: 175px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
            font-family:'Science Gothic' ;
            transition: all 0.2s ease-in-out;
        }
        button:hover{
            background-color: skyblue;
            color: #fff700;
            height: 75px;
            width: 200px;
            font-size: 25px;
            box-shadow: 5px 5px 10px #fff700;
            transition: all 0.2s ease-in-out;
        }
        .heading{
            height: 100px;
            display: flex;

            margin-bottom: 20px;
            padding-bottom: 20px;

            padding-left: 20px;
            padding-right: 20px;

        }
    </style>
</head>
<body>
    <div class="main">
        <div class="heading">
            <h1>Let's</h1>
            <h1>play</h1>
            <h1>Rock</h1>
            <h1>Paper</h1>
            <h1>Scissors</h1>
        </div>
        <button onclick="startGame()">Play Now!</button>
        <table id="scoreTable">
            <thead>
                <tr>
                    <th>Rounds</th>
                    <th>Your Choice</th>
                    <th>Computer Choice</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="historyBody">
            </tbody>
        </table>
    </div>
    </body>
</html>
